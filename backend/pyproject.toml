[project]
name = "alchat-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3", "pymysql>=1.1,<2", "pymongo>=4.13,<5", "redis>=5,<7",
  "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "bcrypt>=4.2,<6",
  "cryptography>=44,<48", "httpx>=0.28,<1", "tiktoken>=0.9,<1",
  "langchain>=1.4,<2", "langchain-openai>=1,<3", "langchain-tavily>=0.2,<2",
  "openai>=2,<3", "cos-python-sdk-v5>=1.9,<2",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-mock>=3,<4", "mongomock>=4.1,<5", "fakeredis>=2.20,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
