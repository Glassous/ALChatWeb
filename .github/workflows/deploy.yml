name: Deploy to 1Panel Server

on:
  push:
    branches: [ "main" ]

# 同一分支串行部署，避免连续推送时多个部署任务在服务器上互相干扰
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. 先分析本次 push 改动了哪些文件，区分 前端 / 后端 / 无关文件
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: 拉取代码（含完整历史，用于 diff 对比）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 按路径识别改动范围
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'eslint.config.js'

  # 2. 仅当存在前端或后端相关改动时才连接服务器，且只部署受影响的模块
  deploy:
    needs: detect-changes
    # README / LICENSE / .github / docs 等无关改动不会触发部署
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 执行自动部署脚本
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # ================= 配置区 =================
            TARGET_DIR="/opt/alchat/alchatweb"
            REPO_URL="https://github.com/Glassous/ALChatWeb.git"
            SITE_DIR="/opt/1panel/www/sites/alchatweb/index/"
            # ==========================================

            # 1. 智能拉取代码
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "📦 首次部署：正在拉取全新仓库..."
              mkdir -p /opt/alchat
              cd /opt/alchat
              git clone $REPO_URL alchatweb
              cd alchatweb
            else
              echo "🔄 后续部署：正在同步最新代码..."
              cd $TARGET_DIR
              git fetch --all
              git reset --hard origin/main
            fi

            # 2. 部署后端 (Docker) —— 仅后端相关文件有改动时执行
            if [ "${{ needs.detect-changes.outputs.backend }}" == "true" ]; then
              echo "🐳 检测到后端改动，正在构建并重启后端服务..."
              sudo docker-compose up -d --build backend
            else
              echo "⏭️ 本次无后端改动，跳过 Docker 构建"
            fi

            # 3. 部署前端 (静态编译) —— 仅前端相关文件有改动时执行
            if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
              echo "⚛️ 检测到前端改动，正在打包前端静态文件..."
              cd $TARGET_DIR
              npm install
              npm run build

              # 4. 发布前端到 1Panel 网站目录
              echo "📂 正在覆盖前端页面..."
              sudo mkdir -p $SITE_DIR
              sudo cp -r dist/* $SITE_DIR
            else
              echo "⏭️ 本次无前端改动，跳过前端打包"
            fi

            echo "✅ 部署全部完成！起飞！"
